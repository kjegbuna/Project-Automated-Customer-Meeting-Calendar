<style>
  :root{
    --text:#37352f; --grey:#787774; --faint:#9b9a97;
    --line:rgba(55,53,47,.09); --line2:rgba(55,53,47,.16);
    --bg:#fff; --side:#f7f7f5; --hover:rgba(55,53,47,.055); --blue:#2383e2;
    --cg-green-bg:#dbeddb; --cg-green-tx:#1c3829;
    --cg-blue-bg:#d3e5ef; --cg-blue-tx:#183347;
    --cg-yellow-bg:#fdecc8; --cg-yellow-tx:#402c1b;
    --cg-red-bg:#ffe2dd; --cg-red-tx:#5d1715;
    --cg-purple-bg:#e8deee; --cg-purple-tx:#3c2c47;
    --cg-gray-bg:#e3e2e0; --cg-gray-tx:#32302c;
    --cg-orange-bg:#faebdd; --cg-orange-tx:#49290f;
    --callout-bg:#f7f6f3;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,"Apple Color Emoji","Segoe UI Emoji",sans-serif;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;font-size:15px}
  button{font-family:inherit;cursor:pointer}
  .layout{display:flex;min-height:100vh}
  /* ---------- SIDEBAR ---------- */
  .side{width:260px;flex-shrink:0;background:var(--side);border-right:1px solid var(--line);padding:8px 6px;font-size:14px;color:var(--grey);display:flex;flex-direction:column}
  .ws{display:flex;align-items:center;gap:8px;padding:8px 8px;border-radius:6px;cursor:default}
  .ws .wsico{width:22px;height:22px;border-radius:5px;background:linear-gradient(135deg,#3f5bff,#1b2559);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}
  .ws b{color:var(--text);font-size:14px;font-weight:600}
  .ws .tag{font-size:10px;background:var(--cg-gray-bg);color:var(--cg-gray-tx);border-radius:4px;padding:1px 5px;font-weight:600;margin-left:auto}
  .snav{margin:6px 0 2px}
  .si{display:flex;align-items:center;gap:9px;padding:5px 8px;border-radius:6px;cursor:pointer;color:var(--grey);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .si:hover{background:var(--hover)}
  .si.active{background:rgba(55,53,47,.08);color:var(--text);font-weight:600}
  .si .em{width:18px;text-align:center;flex-shrink:0}
  .slabel{font-size:11px;font-weight:600;color:var(--faint);letter-spacing:.3px;padding:14px 8px 4px;text-transform:uppercase}
  .si.child{padding-left:26px;font-size:13.5px}
  .sfoot{margin-top:auto;padding:10px 8px;font-size:11.5px;color:var(--faint);border-top:1px solid var(--line)}
  .personmini{display:flex;align-items:center;gap:8px;padding:4px 8px;font-size:13px}
  .pav{width:20px;height:20px;border-radius:50%;color:#fff;font-weight:700;font-size:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  /* ---------- MAIN ---------- */
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .mtop{height:45px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--line);font-size:13.5px;color:var(--grey)}
  .mtop .bc{display:flex;align-items:center;gap:7px}
  .mtop .bc .cico{opacity:.8}
  .mtop .bc button{background:none;border:none;color:var(--grey);font:inherit;cursor:pointer;padding:2px 4px;border-radius:4px}
  .mtop .bc button:hover{background:var(--hover)}
  .mtop .acts{display:flex;gap:14px;color:var(--faint)}
  .content{max-width:960px;width:100%;margin:0 auto;padding:20px 60px 80px}
  @media(max-width:720px){.content{padding:16px 20px 60px}.side{display:none}}
  .pgtitle{font-size:32px;font-weight:700;letter-spacing:-.4px;display:flex;align-items:center;gap:12px;margin:14px 0 4px}
  .pgtitle .em{font-size:34px}
  .pgdesc{color:var(--grey);font-size:14.5px;line-height:1.5;margin:0 0 16px}

  .callout .cem{font-size:17px;line-height:1.4;flex-shrink:0}
  .callout.green{background:var(--cg-green-bg);color:var(--cg-green-tx)}
  .callout.yellow{background:var(--cg-yellow-bg);color:var(--cg-yellow-tx)}
  .callout code{background:rgba(255,255,255,.6);border-radius:3px;padding:1px 6px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
  .syncbtn{border:1px solid var(--line2);background:#fff;color:var(--text);font-weight:500;font-size:13px;border-radius:6px;padding:5px 11px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  .syncbtn:hover{background:var(--hover)} .syncbtn:disabled{opacity:.5;cursor:default}
  .synclog{margin-top:10px;display:flex;flex-direction:column;gap:6px}
  .sl{display:flex;align-items:flex-start;gap:9px;font-size:13px;color:var(--text);opacity:0;transform:translateY(3px);transition:.22s}
  .sl.show{opacity:1;transform:none}
  .sl .ic{width:16px;height:16px;flex-shrink:0;margin-top:1px}
  .spin{width:13px;height:13px;border:2px solid rgba(55,53,47,.15);border-top-color:var(--grey);border-radius:50%;animation:sp .6s linear infinite;margin:1px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .chk{color:#1c8a5b}
  .sl .n{font-weight:700}
  .synced-meta{font-size:12.5px;color:var(--faint);margin-top:9px}

  /* view tabs */
  .vtabs{display:flex;align-items:center;gap:2px;border-bottom:1px solid var(--line);margin:18px 0 0}
  .vt{font-size:14px;color:var(--grey);padding:7px 9px;border-bottom:2px solid transparent;cursor:pointer;display:flex;align-items:center;gap:6px}
  .vt.active{color:var(--text);border-bottom-color:var(--text);font-weight:500}
  .vtools{margin-left:auto;display:flex;gap:12px;color:var(--faint);font-size:13px;align-items:center}

  /* database table */
  .tbl{width:100%;border-collapse:collapse;margin-top:0}
  .tbl th{text-align:left;font-size:12.5px;font-weight:500;color:var(--grey);padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
  .tbl th .th{display:flex;align-items:center;gap:6px}
  .tbl td{padding:7px 8px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle;white-space:nowrap}
  .tbl tr.row{cursor:pointer}
  .tbl tr.row:hover td{background:var(--hover)}
  .nm{max-width:340px}
  .nmcell{display:flex;align-items:center;gap:8px;min-width:0}
  .nmcell .em{flex-shrink:0}
  .nmcell .nmt{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tbl tr.row:hover .nmt{text-decoration:underline}
  .open{margin-left:auto;font-size:11px;color:var(--grey);border:1px solid var(--line2);border-radius:4px;padding:1px 6px;opacity:0}
  .tbl tr.row:hover .open{opacity:1}
  .empty{padding:16px 8px;color:var(--faint);font-size:13.5px;display:flex;align-items:center;gap:9px}

  /* select tags */
  .sel{display:inline-flex;align-items:center;gap:5px;border-radius:4px;padding:2px 8px;font-size:12.5px;font-weight:500;line-height:1.6;max-width:100%}
  .sel .dot{width:7px;height:7px;border-radius:50%}
  .green{background:var(--cg-green-bg);color:var(--cg-green-tx)} .blue{background:var(--cg-blue-bg);color:var(--cg-blue-tx)}
  .yellow{background:var(--cg-yellow-bg);color:var(--cg-yellow-tx)} .red{background:var(--cg-red-bg);color:var(--cg-red-tx)}
  .purple{background:var(--cg-purple-bg);color:var(--cg-purple-tx)} .gray{background:var(--cg-gray-bg);color:var(--cg-gray-tx)}
  .orange{background:var(--cg-orange-bg);color:var(--cg-orange-tx)}
  .person{display:inline-flex;align-items:center;gap:6px;font-size:13.5px}

  .skiptoggle{margin-top:22px}
  details>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:6px;font-size:14px;color:var(--text);padding:5px 4px;border-radius:5px;font-weight:500}
  details>summary::-webkit-details-marker{display:none}
  details>summary:hover{background:var(--hover)}
  .tri{transition:transform .15s;color:var(--grey);font-size:11px}
  details[open] .tri{transform:rotate(90deg)}
  .skiprow{display:flex;align-items:center;gap:10px;padding:6px 8px 6px 24px;font-size:13.5px;color:var(--grey);border-bottom:1px solid var(--line)}
  .skiprow:last-child{border-bottom:none}
  .skiprow .st{color:var(--text)}
  .skiprow .sw{margin-left:auto;font-size:12.5px;color:var(--faint)}

  /* board (By owner) */
  .board{display:flex;gap:12px;overflow-x:auto;padding:8px 2px 4px}
  .bcol{flex:0 0 236px;min-width:236px}
  .bcolh{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--text);padding:4px 4px 10px}
  .bcolh b{font-weight:600}
  .bcolh .bcount{color:var(--faint);font-weight:500;font-size:13px}
  .bcard{background:#fff;border:1px solid var(--line);border-radius:7px;box-shadow:0 1px 2px rgba(15,15,15,.06);padding:9px 11px;margin-bottom:8px;cursor:pointer}
  .bcard:hover{background:var(--hover)}
  .bcard .bct{font-size:13.5px;font-weight:500;display:flex;gap:6px;line-height:1.32}
  .bcard .bcp{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
  .bcard .bcmeta{font-size:11.5px;color:var(--faint);margin-top:8px}
  .bcard.empty{color:var(--faint);font-size:12.5px;cursor:default;text-align:center;border-style:dashed;box-shadow:none}
  /* calendar */
  .caltop{display:flex;align-items:center;justify-content:space-between;margin:12px 2px 10px}
  .caltop b{font-size:16px;font-weight:600}
  .calnav{display:flex;gap:5px}
  .calnav button{border:1px solid var(--line2);background:#fff;border-radius:6px;padding:3px 10px;font-size:13px;color:var(--text);cursor:pointer}
  .calnav button:hover{background:var(--hover)}
  .calgrid{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line)}
  .calhd{font-size:12px;color:var(--grey);padding:6px 8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:#fbfbfa;font-weight:500}
  .calcell{min-height:112px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px 5px;overflow:hidden}
  .calcell.empty{background:#fcfcfb}
  .caldate{text-align:right;margin-bottom:3px;line-height:1}
  .caldate .num{display:inline-block;font-size:12.5px;color:var(--grey);min-width:22px;height:22px;line-height:22px;text-align:center}
  .caldate .num.today{background:var(--blue);color:#fff;border-radius:50%;font-weight:600}
  .calev{background:#f1f1ef;border-radius:5px;padding:4px 7px;margin-bottom:4px;cursor:pointer}
  .calev:hover{background:#e8e8e6}
  .calevt{font-size:12px;font-weight:500;display:flex;gap:5px;line-height:1.25;align-items:center}
  .calevt .em{flex-shrink:0}
  .calevt .ttl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .calev .sel{margin-top:4px;display:inline-flex}

  /* ---------- PAGE VIEW ---------- */
  .pgicon-lg{font-size:46px;margin:6px 0 2px}
  .pgh1{font-size:34px;font-weight:700;letter-spacing:-.4px;margin:2px 0 14px}
  .props{margin:6px 0 12px;display:flex;flex-direction:column;gap:2px}
  .prop{display:flex;align-items:flex-start;font-size:14px;min-height:30px}
  .prop .k{width:180px;flex-shrink:0;color:var(--grey);display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:5px}
  .prop .k .pe{width:16px;text-align:center;opacity:.85;font-size:14px}
  .prop .v{flex:1;padding:5px 8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-width:0}
  .prop .v.plain{color:var(--text)}
  .divider{height:1px;background:var(--line);margin:14px 0}
  .h2b{font-size:20px;font-weight:600;margin:20px 0 6px;display:flex;align-items:center;gap:8px}
  .body-p{font-size:15px;line-height:1.65;color:var(--text);margin:0 0 10px}
  .bul{margin:0 0 10px;padding-left:20px;font-size:15px;line-height:1.7}
  .bul li{margin:2px 0}
  .quote{border-left:3px solid var(--text);padding:2px 0 2px 14px;margin:10px 0;font-size:15px;line-height:1.6}
  .quote .who{font-weight:600;font-size:13px;color:var(--grey);display:block;margin-bottom:1px}
  .reclink{color:var(--blue);text-decoration:none;font-size:14px;display:inline-flex;align-items:center;gap:5px;cursor:default}
  .reclink:hover{text-decoration:underline}
  .id-txt{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;color:var(--grey)}
</style>
</head>

<script>

function renderShell(){

    <div class="slabel">Team calendars synced</div>
    ${team}
    <div class="sfoot">Sample data · demo build.<br>Runs entirely in your browser.</div>`;
}
function setTop(html){ $("mtop").innerHTML=html; }
function selTeamNav(isDb){ const el=$("navdb"); if(el) el.classList.toggle("active", isDb); }

let synced=false;
function renderDatabase(skipSync){
  selTeamNav(true);
  setTop(`<div class="bc"><span class="cico">🗂️</span><button onclick="renderDatabase(false)">Customer Meetings</button></div><div class="acts">Share · ⋆ · •••</div>`);
  $("main").innerHTML=`
    <div class="pgtitle"><span class="em">🗂️</span>Customer Meetings</div>
    <p class="pgdesc">Every customer meeting the team has — logged automatically, with the recording, transcript, and an AI summary. Nobody fills this in by hand.</p>
    <div class="callout" id="autoCallout">
      <span class="cem">⚡</span>
      <div style="flex:1">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap">
          <div><b>Auto-synced from Google Calendar.</b> Checks 4 team calendars daily, detects customer meetings by attendee domain, and adds a page here for each one.</div>
          <button class="syncbtn" id="syncBtn" onclick="runSync()">↻ Sync now</button>
        </div>
        <div class="synclog" id="synclog"></div>
        <div class="synced-meta" id="syncmeta"></div>
      </div>
    </div>
    <div class="vtabs">
      <div class="vt ${currentView==='table'?'active':''}" onclick="setView('table')">▦ Table</div>
      <div class="vt ${currentView==='owner'?'active':''}" onclick="setView('owner')">▤ By owner</div>
      <div class="vt ${currentView==='calendar'?'active':''}" onclick="setView('calendar')">🗓 Calendar</div>
      <div class="vtools">Filter · Sort · Q · New</div>
    </div>
    <div id="viewbody"></div>
    <div class="skiptoggle">
      <details>
        <summary><span class="tri">▶</span>⛔ Skipped by the automation · ${SKIPPED.length} of 21 shown</summary>
        <div style="margin-top:2px">${SKIPPED.map(s=>`<div class="skiprow"><span>✕</span><span class="st">${s.title}</span><span class="sw">${s.why}</span></div>`).join("")}</div>
      </details>
    </div>`;
  markSynced(); synced=true; renderView();   // always show the populated database on load
}
function rowsHTML(){
  return MEETINGS.map(m=>{
    const t=TEAM[m.owner]; const st=m.status==="enriched"?`<span class="sel green"><span class="dot" style="background:#1c8a5b"></span>Enriched</span>`:`<span class="sel yellow"><span class="dot" style="background:#cb912f"></span>Transcript pending</span>`;
    return `<tr class="row" onclick="renderPage('${m.id}')">
      <td class="nm"><div class="nmcell"><span class="em">🗓️</span><span class="nmt">${m.title}</span><span class="open">OPEN ↗</span></div></td>
      <td><span class="sel blue">${m.company}</span></td>
      <td><span class="person"><span class="pav" style="background:${t.c}">${initials(t.name)}</span>${t.name}</span></td>
      <td>${shortDate(dAgo(m.days))}</td>
      <td>${st}</td>
      <td><span class="sel ${srcColor(m.source)}">${m.source}</span></td>
    </tr>`;
  }).join("");
}
function fillTable(){ const b=$("dbbody"); if(b) b.innerHTML=rowsHTML(); }
function tableHTML(){
  return `<table class="tbl"><thead><tr>
    <th style="width:34%"><div class="th">🗓️ Name</div></th>
    <th><div class="th">🏢 Customer</div></th>
    <th><div class="th">👤 Owner</div></th>
    <th><div class="th">📅 Date</div></th>
    <th><div class="th">◍ Status</div></th>
    <th><div class="th">✦ Source</div></th>
  </tr></thead><tbody id="dbbody">${rowsHTML()}</tbody></table>`;
}
function cardHTML(m){
  const st=m.status==="enriched"?`<span class="sel green" style="padding:0 7px">Enriched</span>`:`<span class="sel yellow" style="padding:0 7px">Pending</span>`;
  return `<div class="bcard" onclick="renderPage('${m.id}')">
    <div class="bct"><span class="em">🗓️</span>${m.title}</div>
    <div class="bcp"><span class="sel blue">${m.company}</span>${st}</div>
    <div class="bcmeta">${shortDate(dAgo(m.days))} · ${m.platform} · ${m.source}</div>
  </div>`;
}
function ownerHTML(){
  return `<div class="board">`+Object.keys(TEAM).map(k=>{
    const t=TEAM[k]; const ms=MEETINGS.filter(m=>m.owner===k);
    const cards=ms.length?ms.map(cardHTML).join(""):`<div class="bcard empty">No meetings</div>`;
    return `<div class="bcol"><div class="bcolh"><span class="pav" style="background:${t.c}">${initials(t.name)}</span><b>${t.name.split(" ")[0]}</b><span class="bcount">${ms.length}</span></div>${cards}</div>`;
  }).join("")+`</div>`;
}
function calEvent(m){
  const st=m.status==="enriched"?`<span class="sel green" style="padding:0 6px;font-size:11px">Enriched</span>`:`<span class="sel yellow" style="padding:0 6px;font-size:11px">Pending</span>`;
  return `<div class="calev" onclick="event.stopPropagation();renderPage('${m.id}')"><div class="calevt"><span class="em">🗓️</span><span class="ttl">${m.company} — ${m.title}</span></div>${st}</div>`;
}
function calendarHTML(){
  const base=new Date(TODAY); base.setDate(1); base.setMonth(base.getMonth()+calOffset);
  const year=base.getFullYear(), month=base.getMonth();
  const monthName=base.toLocaleDateString('en-US',{month:'long',year:'numeric'});
  const firstDow=new Date(year,month,1).getDay(), daysInMonth=new Date(year,month+1,0).getDate();
  const byDay={}; MEETINGS.forEach(m=>{const d=dAgo(m.days); if(d.getFullYear()===year&&d.getMonth()===month){(byDay[d.getDate()]=byDay[d.getDate()]||[]).push(m);} });
  const todayD=(TODAY.getFullYear()===year&&TODAY.getMonth()===month)?TODAY.getDate():-1;
  const cells=[]; for(let i=0;i<firstDow;i++) cells.push(null);
  for(let d=1;d<=daysInMonth;d++) cells.push(d);
  while(cells.length%7) cells.push(null);
  const wd=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(w=>`<div class="calhd">${w}</div>`).join("");
  const body=cells.map(d=>{
    if(d===null) return `<div class="calcell empty"></div>`;
    const evs=(byDay[d]||[]).map(calEvent).join("");
    return `<div class="calcell"><div class="caldate"><span class="num ${d===todayD?'today':''}">${d}</span></div>${evs}</div>`;
  }).join("");
  return `<div class="caltop"><b>${monthName}</b><div class="calnav"><button onclick="calShift(-1)">‹</button><button onclick="calShift(0)">Today</button><button onclick="calShift(1)">›</button></div></div><div class="calgrid">${wd}${body}</div>`;
}
function calShift(n){ calOffset = n===0 ? 0 : calOffset+n; renderView(); }
function renderView(){
  const vb=$("viewbody"); if(!vb) return;
  vb.innerHTML = currentView==='owner' ? ownerHTML() : currentView==='calendar' ? calendarHTML() : tableHTML();
}
function setView(v){ currentView=v; if(v!=='calendar') calOffset=0; renderDatabase(); }
let running=false, currentView='table', calOffset=0;
function runSync(){
  if(running) return;
  if(currentView!=='table'){ currentView='table'; renderDatabase(); }
  running=true;
  const btn=$("syncBtn"); if(btn){btn.disabled=true;btn.textContent="Syncing…";}
  $("syncmeta").textContent=""; const log=$("synclog"); log.innerHTML="";
  $("dbbody").innerHTML=`<tr><td colspan="6"><div class="empty"><span class="spin"></span> Syncing from Google Calendar…</div></td></tr>`;
  const rows=STEPS.map(txt=>{const d=document.createElement("div");d.className="sl";d.innerHTML=`<span class="ic"><span class="spin"></span></span><span>${txt}</span>`;log.appendChild(d);return d;});
  let i=0;
  const tick=()=>{
    if(i>0) rows[i-1].querySelector(".ic").innerHTML=`<svg class="chk" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>`;
    if(i<rows.length){ rows[i].classList.add("show"); i++; setTimeout(tick,480); }
    else { fillTable(); markSynced(); synced=true; if(btn){btn.disabled=false;btn.textContent="↻ Sync now";} running=false; }
  };
  rows[0].classList.add("show"); i=1; setTimeout(tick,480);
}
function markSynced(){ const m=$("syncmeta"); if(m) m.textContent="Last sync: just now · scanned 27 events · added 6 · skipped 21 · next run in 6h"; }

function propRow(pe,k,vhtml,plain){ return `<div class="prop"><div class="k"><span class="pe">${pe}</span>${k}</div><div class="v ${plain?'plain':''}">${vhtml}</div></div>`; }
function renderPage(id){
  const m=MEETINGS.find(x=>x.id===id); const t=TEAM[m.owner];
  selTeamNav(false);
  setTop(`<div class="bc"><span class="cico">🗂️</span><button onclick="renderDatabase(true)">Customer Meetings</button><span>/</span><span>🗓️ ${m.title}</span></div><div class="acts">Share · ⋆ · •••</div>`);
  const statusTag=m.status==="enriched"?`<span class="sel green"><span class="dot" style="background:#1c8a5b"></span>Enriched</span>`:`<span class="sel yellow"><span class="dot" style="background:#cb912f"></span>Transcript pending</span>`;
  const attHtml=m.att.map(a=>{const col=a[2]==='int'?(TEAM[m.owner].c):"#5b6b7a";return `<span class="person"><span class="pav" style="background:${col}">${initials(a[0])}</span>${a[0]} <span class="sel ${a[2]==='cust'?'blue':'gray'}" style="padding:0 6px">${a[2]==='cust'?'customer':'internal'}</span></span>`;}).join("");
  const props=
    propRow("🏢","Customer",`<span class="sel blue">${m.company}</span>`)+
    propRow("📅","Date",fmtDate(dAgo(m.days)),true)+
    propRow("👤","Owner",`<span class="person"><span class="pav" style="background:${t.c}">${initials(t.name)}</span>${t.name}</span>`)+
    propRow("💻","Platform",`<span class="sel ${platColor(m.platform)}">${m.platform}</span>`)+
    propRow("⏱","Duration",m.dur,true)+
    propRow("◍","Status",statusTag)+
    propRow("✦","Source",`<span class="sel ${srcColor(m.source)}">${m.source}</span>`)+
    propRow("👥","Attendees",attHtml)+
    propRow("▶","Recording",m.status==="enriched"?`<a class="reclink">🎬 meeting-recording.mp4 ↗</a>`:'<span style="color:var(--faint)">Empty</span>')+
    propRow("＃","Event ID (dedupe key)",`<span class="id-txt">${m.id.toLowerCase().replace('mtg','evt')}-9f3a</span>`,true);
  let content=`<div class="callout green"><span class="cem">✅</span><div><b>Detected as a customer meeting.</b> An attendee's email domain <code>@${m.domain}</code> matched a known customer (<b>${m.company}</b>), so the automation created this page. Internal-only and personal events are skipped.</div></div>`;
  if(m.status==="enriched"){
    content+=`<div class="h2b">🧠 AI summary</div><p class="body-p">${m.summary}</p><ul class="bul">${m.kp.map(k=>`<li>${k}</li>`).join("")}</ul>
      <div class="divider"></div>
      <details open><summary><span class="tri">▶</span>💬 Transcript (excerpt)</summary>
        <div style="padding:8px 0 0 8px">${m.transcript.map(x=>`<div class="quote"><span class="who">${x[0]}</span>${x[1]}</div>`).join("")}</div>
      </details>`;
  } else {
    content+=`<div class="h2b">🧠 AI summary</div><div class="callout yellow"><span class="cem">⏳</span><div><b>Transcript pending.</b> This meeting just finished. The page was created automatically with all the properties above; the automation re-checks ${m.source} and fills in the recording, transcript, and AI summary as soon as they're published — usually within a few minutes.</div></div>`;
  }
  $("main").innerHTML=`
    <div class="pgicon-lg">🗓️</div>
    <div class="pgh1">${m.title}</div>
    <div class="props">${props}</div>
    <div class="divider"></div>
    ${content}`;
  window.scrollTo(0,0);
}
renderShell();
renderDatabase(false);
</script>
</body>
</html>
